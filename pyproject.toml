[project]
name = "gan-quickdraw"
version = "1.0.0"
description = "GAN (DCGAN) que aprende a dibujar una categoría del dataset Quick, Draw! de Google"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

